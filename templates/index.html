<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de XML</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Extractor XML</h1>


    <p>
        El sistema clasificará automáticamente:
    </p>

    <ul>
        <li>EMITIDOS</li>
        <li>RECIBIDOS</li>
        <li>SOBRES</li>
        <li>OTROS</li>
    </ul>

    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
    >

        <h3>Asegúrate de estar colocando el RUT correcto del cliente.</h3>


        <label for="rut">
            RUT empresa:
        </label>

        <input
            type="text"
            name="rut"
            id="rut"
            required
        >

        <br><br>

        <label for="file">
            Archivo ZIP:
        </label>

        <input
            type="file"
            name="file"
            id="file"
            accept=".zip"
            required
        >

        <br><br>

        <button
            type="submit"
            id="submitBtn"
        >
            Procesar ZIP
        </button>

    </form>

    <div
        id="loading"
        style="display:none;"
    >

        <div class="spinner"></div>

        <p>
            Procesando archivos...
        </p>

    </div>

</div>

<script>

const form = document.getElementById("uploadForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    document.getElementById("loading").style.display =
        "block";

    document.getElementById("submitBtn").disabled =
        true;

    document.getElementById("submitBtn").innerText =
        "Procesando...";

    const formData = new FormData(form);

    try {

        const response = await fetch(
            "/upload",
            {
                method: "POST",
                body: formData
            }
        );

        // ERROR BACKEND
        if (!response.ok) {

            const data = await response.json();

            alert(
                data.error ||
                "Ocurrió un error procesando el ZIP"
            );

            return;
        }

        // DESCARGA
        const blob = await response.blob();

        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        const contentDisposition =
            response.headers.get(
                "Content-Disposition"
            );

        let filename = "resultado.zip";

if (contentDisposition) {

    // filename*=UTF-8''
    let match = contentDisposition.match(
        /filename\*=UTF-8''(.+)/
    );

    if (match && match[1]) {

        filename = decodeURIComponent(
            match[1]
        );

    } else {

        // filename=""
        match = contentDisposition.match(
            /filename="?([^"]+)"?/
        );

        if (match && match[1]) {
            filename = match[1];
        }
    }
}

if (!filename.toLowerCase().endsWith(".zip")) {
    filename += ".zip";
}

        a.download = filename;

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(url);

    }

    catch (err) {

        alert(
            "Error inesperado procesando el archivo"
        );

    }

    finally {

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("submitBtn").disabled =
            false;

        document.getElementById("submitBtn").innerText =
            "Procesar ZIP";
    }

});

</script>

</body>
</html>
