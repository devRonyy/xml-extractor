<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Flatten ZIP Extractor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Extractor XML</h1>

    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
    >

        <label for="rut">RUT:</label>

        <input
            type="text"
            name="rut"
            id="rut"
            required
        >

        <br><br>

        <label for="file">Archivo ZIP:</label>

        <input
            type="file"
            name="file"
            id="file"
            accept=".zip"
            required
        >

        <br><br>

        <button
            type="submit"
            id="submitBtn"
        >
            Procesar ZIP
        </button>

    </form>

    <div
        id="loading"
        style="display:none;"
    >

        <div class="spinner"></div>

        <p>
            Procesando archivos...
            Esto puede tardar varios segundos.
        </p>

    </div>

    <div class="info">

        <h3>
            El sistema detecta automáticamente:
        </h3>

        <ul>
            <li>CFE emitidos</li>
            <li>CFE recibidos</li>
            <li>Sobres</li>
            <li>Otros XML</li>
        </ul>

    </div>

</div>

<script>

document
    .getElementById("uploadForm")
    .addEventListener("submit", function() {

        document.getElementById("loading").style.display = "block";

        document.getElementById("submitBtn").disabled = true;

        document.getElementById("submitBtn").innerText =
            "Procesando...";
    });

</script>

</body>
</html>
