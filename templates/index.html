<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Flatten ZIP Extractor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Extractor XML</h1>

    <h3>Asegúrate de estar colocando el RUT correcto del cliente.</h3>

    <p>
        El sistema clasificará automáticamente:
    </p>

    <ul>
        <li>EMITIDOS</li>
        <li>RECIBIDOS</li>
        <li>SOBRES</li>
        <li>OTROS</li>
    </ul>

    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
    >

        <label for="rut">
            RUT empresa:
        </label>

        <input
            type="text"
            name="rut"
            id="rut"
            required
        >

        <br><br>

        <label for="file">
            Archivo ZIP:
        </label>

        <input
            type="file"
            name="file"
            id="file"
            accept=".zip"
            required
        >

        <br><br>

        <button
            type="submit"
            id="submitBtn"
        >
            Procesar ZIP
        </button>

    </form>

    <div
        id="loading"
        style="display:none;"
    >

        <div class="spinner"></div>

        <p>
            Procesando archivos...
        </p>

    </div>

</div>

<script>

const form = document.getElementById("uploadForm");

form.addEventListener("submit", () => {

    document.getElementById("loading").style.display = "block";

    document.getElementById("submitBtn").disabled = true;

    document.getElementById("submitBtn").innerText =
        "Procesando...";

    // Detener loading luego descarga
    setTimeout(() => {

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("submitBtn").disabled =
            false;

        document.getElementById("submitBtn").innerText =
            "Procesar ZIP";

    }, 8000);
});

</script>

</body>
</html>
